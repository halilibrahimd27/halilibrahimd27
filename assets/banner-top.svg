<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="none" width="1200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e13"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="200" fill="url(#bgGrad)"/>
  <rect width="1200" height="200" fill="url(#glow)"/>

  <!-- decorative dots scattered on background -->
  <g fill="#38bdf8" opacity="0.35">
    <circle cx="120"  cy="40"  r="1.2"/>
    <circle cx="280"  cy="70"  r="1.5"/>
    <circle cx="450"  cy="30"  r="1.2"/>
    <circle cx="640"  cy="55"  r="1.8"/>
    <circle cx="820"  cy="35"  r="1.2"/>
    <circle cx="980"  cy="65"  r="1.5"/>
    <circle cx="1120" cy="45"  r="1.2"/>
  </g>
  <g fill="#a78bfa" opacity="0.30">
    <circle cx="200"  cy="90"  r="1.4"/>
    <circle cx="540"  cy="100" r="1.2"/>
    <circle cx="900"  cy="85"  r="1.4"/>
    <circle cx="1080" cy="100" r="1.2"/>
  </g>

  <!-- back wave -->
  <path d="M0,140 C150,90 350,180 600,130 C850,80 1050,180 1200,130 L1200,200 L0,200 Z" fill="url(#wave1)" opacity="0.45"/>
  <!-- front wave -->
  <path d="M0,160 C200,110 400,200 600,150 C800,100 1000,200 1200,150 L1200,200 L0,200 Z" fill="url(#wave2)"/>
</svg>
