<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="none" width="1200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="200" fill="url(#bgGrad)"/>
  <rect width="1200" height="200" fill="url(#glow)"/>

  <!-- decorative dots scattered on background -->
  <g fill="#4ade80" opacity="0.35">
    <circle cx="120"  cy="170" r="1.2"/>
    <circle cx="280"  cy="140" r="1.5"/>
    <circle cx="450"  cy="180" r="1.2"/>
    <circle cx="640"  cy="155" r="1.8"/>
    <circle cx="820"  cy="175" r="1.2"/>
    <circle cx="980"  cy="145" r="1.5"/>
    <circle cx="1120" cy="165" r="1.2"/>
  </g>
  <g fill="#a78bfa" opacity="0.30">
    <circle cx="200"  cy="120" r="1.4"/>
    <circle cx="540"  cy="110" r="1.2"/>
    <circle cx="900"  cy="125" r="1.4"/>
    <circle cx="1080" cy="115" r="1.2"/>
  </g>

  <!-- mirrored waves at top -->
  <path d="M0,60 C150,110 350,20 600,70 C850,120 1050,20 1200,70 L1200,0 L0,0 Z" fill="url(#wave1)" opacity="0.45"/>
  <path d="M0,40 C200,90 400,0 600,50 C800,100 1000,0 1200,50 L1200,0 L0,0 Z" fill="url(#wave2)"/>
</svg>
